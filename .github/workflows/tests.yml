name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bash -n launch
      - run: uv sync --locked
      - run: uv run python -m unittest -v
      - run: ./launch --start --seed 7 --frames 120 --no-save
      - run: ./launch --fullscreen --start --reduced-motion --frames 60 --no-save
